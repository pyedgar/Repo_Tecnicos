<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Kenia</title>
    <style>
        body {
            background-image: url(../fondo.png); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            color: #fff;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            border: 3px solid #fdab4c;
            width: 320px;
        }
        h2 {
            color: #fdab4c;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-transform: uppercase;
        }
        input[type="number"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #fdab4c;
            border-radius: 8px;
            background: #222;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
        }
        .resultado-box {
            margin: 20px 0;
            padding: 15px;
            background: rgba(253, 171, 76, 0.2);
            border: 2px dashed #fdab4c;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
        }
        .botones {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        button {
            background: #fdab4c;
            color: #000;
            border: 2px solid #000;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 3px 3px 0 #000;
        }
        button:hover {
            background: #ffc107;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000;
        }
        .btn-clear {
            grid-column: span 2;
            background: #d32f2f;
            color: white;
            border-color: #000;
        }
        .btn-clear:hover {
            background: #f44336;
        }
    </style>
</head>
<body>

    <a href="../index.html" style="position: fixed; top: 20px; left: 20px; background-color: rgba(0,0,0,0.8); color: #fdab4c; padding: 12px 20px; text-decoration: none; border-radius: 8px; z-index: 1000; font-family: 'Times New Roman', serif; font-weight: bold; border: 2px solid #fdab4c; transition: all 0.2s ease; box-shadow: 3px 3px 0 #000;" onmouseover="this.style.background='#fdab4c'; this.style.color='#000'; this.style.transform='translate(2px, 2px)'; this.style.boxShadow='1px 1px 0 #000'" onmouseout="this.style.background='rgba(0,0,0,0.8)'; this.style.color='#fdab4c'; this.style.transform='translate(0, 0)'; this.style.boxShadow='3px 3px 0 #000'">⬅ Volver al Perfil</a>

    <div class="container">
        <h2>🧮 Calculadora</h2>
        <input type="number" id="num1" placeholder="Primer Número">
        <input type="number" id="num2" placeholder="Segundo Número">
        
        <div class="resultado-box" id="resultado">Resultado: --</div>

        <div class="botones">
            <button onclick="calcular('+')">➕ Sumar</button>
            <button onclick="calcular('-')">➖ Restar</button>
            <button onclick="calcular('*')">✖ Multiplicar</button>
            <button onclick="calcular('/')">➗ Dividir</button>
            <button class="btn-clear" onclick="limpiar()">🧹 Limpiar</button>
        </div>
    </div>

    <script>
        function calcular(operacion) {
            let n1 = parseFloat(document.getElementById('num1').value);
            let n2 = parseFloat(document.getElementById('num2').value);
            let res = document.getElementById('resultado');

            if (isNaN(n1) || isNaN(n2)) {
                res.innerText = "Ingresa números válidos";
                return;
            }

            let resultado = 0;
            switch(operacion) {
                case '+': resultado = n1 + n2; break;
                case '-': resultado = n1 - n2; break;
                case '*': resultado = n1 * n2; break;
                case '/': 
                    if(n2 === 0) {
                        res.innerText = "Error: Div por cero";
                        return;
                    }
                    resultado = n1 / n2; 
                    break;
            }
            res.innerText = "Resultado: " + resultado;
        }

        function limpiar() {
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';
            document.getElementById('resultado').innerText = 'Resultado: --';
        }
    </script>
</body>
</html>
