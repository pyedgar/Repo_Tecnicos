<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="index.html" style="position: fixed; top: 20px; left: 20px; background-color: rgba(255, 255, 255, 0.9); color: #667eea; padding: 12px 20px; text-decoration: none; border-radius: 8px; z-index: 1000; font-family: Arial, sans-serif; font-weight: bold; border: 2px solid #667eea; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1);" onmouseover="this.style.background='#667eea'; this.style.color='white'" onmouseout="this.style.background='rgba(255, 255, 255, 0.9)'; this.style.color='#667eea'">⬅ Volver al Perfil</a>

  <div class="calculadora">
    <input type="text" id="pantalla" readonly value="0">

    <div class="botones">
      <button class="limpiar" onclick="limpiar()">C</button>
      <button onclick="borrar()">⌫</button>
      <button class="operador" onclick="agregar('/')">÷</button>
      <button class="operador" onclick="agregar('*')">×</button>

      <button onclick="agregar('7')">7</button>
      <button onclick="agregar('8')">8</button>
      <button onclick="agregar('9')">9</button>
      <button class="operador" onclick="agregar('-')">-</button>

      <button onclick="agregar('4')">4</button>
      <button onclick="agregar('5')">5</button>
      <button onclick="agregar('6')">6</button>
      <button class="operador" onclick="agregar('+')">+</button>

      <button onclick="agregar('1')">1</button>
      <button onclick="agregar('2')">2</button>
      <button onclick="agregar('3')">3</button>
      <button class="igual" onclick="calcular()">=</button>

      <button onclick="agregar('0')">0</button>
      <button onclick="agregar('.')">.</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
