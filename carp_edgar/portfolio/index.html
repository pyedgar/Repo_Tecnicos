<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edgar Reyes - Portafolio</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../index.html" style="position: fixed; top: 20px; left: 20px; background-color: rgba(10, 20, 40, 0.8); color: #00f3ff; padding: 12px 20px; text-decoration: none; border-radius: 8px; z-index: 1000; font-family: 'Orbitron', sans-serif; font-weight: bold; border: 1px solid #00f3ff; transition: all 0.3s; box-shadow: 0 0 10px rgba(0,243,255,0.3);" onmouseover="this.style.background='#00f3ff'; this.style.color='#000'; this.style.boxShadow='0 0 20px #00f3ff'" onmouseout="this.style.background='rgba(10, 20, 40, 0.8)'; this.style.color='#00f3ff'; this.style.boxShadow='0 0 10px rgba(0,243,255,0.3)'">⬅ Volver al Perfil</a>
    <header class="cyber-header">
        <h1><i class="fas fa-terminal"></i> CALCULADORA</h1>
    </header>
    <main>
        <section id="calculator-sec" class="glass-panel fade-in">
            <h2 class="neon-text"><i class="fas fa-calculator"></i> Calculadora de Interfaz</h2>
            <div class="calculator">
                <input type="text" id="display" disabled>
                <div class="keys">
                    <button onclick="appendValue('7')">7</button>
                    <button onclick="appendValue('8')">8</button>
                    <button onclick="appendValue('9')">9</button>
                    <button onclick="setOperation('/')" class="op-btn">/</button>
                    <button onclick="appendValue('4')">4</button>
                    <button onclick="appendValue('5')">5</button>
                    <button onclick="appendValue('6')">6</button>
                    <button onclick="setOperation('*')" class="op-btn">*</button>
                    <button onclick="appendValue('1')">1</button>
                    <button onclick="appendValue('2')">2</button>
                    <button onclick="appendValue('3')">3</button>
                    <button onclick="setOperation('-')" class="op-btn">-</button>
                    <button onclick="appendValue('0')">0</button>
                    <button onclick="clearDisplay()" class="clear-btn">C</button>
                    <button onclick="calculateResult()" class="eval-btn">=</button>
                    <button onclick="setOperation('+')" class="op-btn">+</button>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
