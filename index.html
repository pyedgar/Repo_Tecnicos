<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrade Cedillo Kenia Isamara</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url(fondo.png); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Times New Roman', Times, serif;
            padding: 20px;
        }

        /* Caja principal semitransparente para que se vea el fondo */
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(0, 0, 0, 0.65); /* Fondo oscuro semitransparente */
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            color: #fff;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            border: 3px solid #fdab4c;
        }

        /* El bloque naranja con el nombre, igual que en tu imagen */
        .nombre-bloque {
            display: inline-block;
            background: #fdab4c;
            color: #000;
            padding: 15px 30px;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 3px solid #000;
            box-shadow: 5px 5px 0 #000;
            margin-bottom: 25px;
            font-family: 'Times New Roman', Times, serif;
        }

        /* Texto breve de presentación */
        .presentacion {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        .presentacion strong {
            color: #fdab4c;
        }

        /* Botón hacia la calculadora */
        .boton-calculadora {
            display: inline-block;
            background: #fdab4c;
            color: #000;
            text-decoration: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Times New Roman', Times, serif;
            text-transform: uppercase;
            border: 3px solid #000;
            box-shadow: 5px 5px 0 #000;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .boton-calculadora:hover {
            background: #ffc107;
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 #000;
        }

        /* Estilo para los iconos o detalles pequeños */
        .detalle {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        /* Ajustes para móvil */
        @media (max-width: 500px) {
            .nombre-bloque {
                font-size: 1.3rem;
                padding: 10px 20px;
            }
            .container {
                padding: 20px;
            }
            .presentacion {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bloque naranja con el nombre, igual a tu imagen -->
        <div class="nombre-bloque">Andrade Cedillo Kenia Isamara</div>

        <!-- Un pequeño detalle visual (puedes quitarlo si quieres) -->
        <div class="detalle">🧙‍♂️ 💀 🎲</div>

        <!-- Presentación breve y directa -->
        <div class="presentacion">
            <p>
                <strong>¡Qué tal!</strong> Soy un apasionado de la tecnología y los números. 
                No soy muy fan de las presentaciones largas, así que mejor vamos directo al grano.
            </p>
            <br>
            <p>
                Si necesitas hacer algún cálculo rápido, prueba mi herramienta.
            </p>
        </div>

        <!-- Botón a la calculadora -->
        <a href="calculadora/index.html" class="boton-calculadora" target="_blank">
            🧮 Ir a la Calculadora
        </a>
    </div>

</body>
</html>
